[xdebug]
xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = 172.26.147.84
xdebug.show_exception_trace = 0
; --------------------------------------------------------
; The following xdebug configuration enable/disable it. 
; Enable it when debugging, otherwise disable and enable 
; pcov for coverage.
; --------------------------------------------------------

[PHP]
display_errors = On
display_startup_errors = On
error_reporting = -1
memory_limit = -1

[pcov]
; --------------------------------------------------------
; The following pcov configuration enable/disable it. 
; Enable it when running automatic tests, otherwise 
; disable and enable xdebug for debugging.
; --------------------------------------------------------
pcov.enabled = 1

[Assertion]
zend.assertions = 1
assert.exception = 1