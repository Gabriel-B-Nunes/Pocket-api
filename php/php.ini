[xdebug]
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = 172.26.147.84
xdebug.show_exception_trace = 0

[PHP]
display_errors = On
display_startup_errors = On
error_reporting = -1
memory_limit = -1

[pcov]
pcov.enabled = 0

[Assertion]
zend.assertions = 1
assert.exception = 1